<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard - Root 2 Reach</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-bar { width: 100%; max-width: 400px; padding: 10px; border-radius: 20px; border: 1px solid #ccc; font-size: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">Root 2 Reach</span>
        </div>
        <div class="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="#" id="logout-btn" data-i18n="logout">Logout</a>
        </div>
        <div class="lang-switch">
            <button id="lang-btn">தமிழ் | EN</button>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2><span data-i18n="welcome">Welcome</span>, <span id="user-name"></span></h2>
            <input type="text" id="search-input" class="search-bar" placeholder="Search products...">
        </div>

        <section class="section">
            <h2 class="section-title" data-i18n="traditional_products">Traditional Products</h2>
            <div class="grid" id="products-grid">
                <!-- Product cards will be injected here via JS -->
            </div>
        </section>
    </div>

    <script src="assets/js/dashboard.js"></script>
</body>
</html>
