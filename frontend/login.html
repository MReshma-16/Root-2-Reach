<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Root 2 Reach</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .auth-btn { width: 100%; background: var(--primary-color); color: white; padding: 10px; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; }
        .auth-links { text-align: center; margin-top: 15px; }
        .auth-links a { color: var(--primary-color); text-decoration: none; }
        #error-msg { color: red; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">Root 2 Reach</span>
        </div>
        <div class="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="login.html" data-i18n="login">Login</a>
            <a href="register.html" data-i18n="register">Register</a>
        </div>
        <div class="lang-switch">
            <button id="lang-btn">தமிழ் | EN</button>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 class="section-title" data-i18n="login" style="font-size: 2rem; margin-bottom: 20px;">Login</h2>
            <div id="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label data-i18n="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label data-i18n="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="auth-btn" data-i18n="login_btn">Login</button>
            </form>
            <div class="auth-links">
                <p><a href="#" data-i18n="forgot_password">Forgot Password?</a></p>
                <p><span data-i18n="no_account">Don't have an account?</span> <a href="register.html" data-i18n="register_here">Register Here</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
