<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Root 2 Reach</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .auth-btn { width: 100%; background: var(--secondary-color); color: #333; padding: 10px; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .role-switch { display: flex; justify-content: center; margin-bottom: 20px; }
        .role-btn { padding: 10px 20px; border: 1px solid var(--primary-color); background: white; color: var(--primary-color); cursor: pointer; font-weight: bold; }
        .role-btn.active { background: var(--primary-color); color: white; }
        #seller-fields { display: none; }
        #error-msg { color: red; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">Root 2 Reach</span>
        </div>
        <div class="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="login.html" data-i18n="login">Login</a>
            <a href="register.html" data-i18n="register">Register</a>
        </div>
        <div class="lang-switch">
            <button id="lang-btn">தமிழ் | EN</button>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 class="section-title" data-i18n="register" style="font-size: 2rem; margin-bottom: 20px;">Register</h2>
            
            <div class="role-switch">
                <button type="button" class="role-btn active" id="btn-buyer" data-i18n="buyer">Buyer</button>
                <button type="button" class="role-btn" id="btn-seller" data-i18n="seller">Seller</button>
            </div>

            <div id="error-msg"></div>

            <form id="register-form">
                <input type="hidden" id="role" value="CUSTOMER">
                
                <div class="form-group">
                    <label data-i18n="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label data-i18n="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label data-i18n="phone">Phone</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label data-i18n="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label data-i18n="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <div id="seller-fields">
                    <div class="form-group">
                        <label data-i18n="business_name">Business/Shop Name</label>
                        <input type="text" id="business-name">
                    </div>
                    <div class="form-group">
                        <label data-i18n="district">District</label>
                        <select id="district-select"></select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="address">Address</label>
                        <input type="text" id="address">
                    </div>
                </div>

                <button type="submit" class="auth-btn" data-i18n="register_btn">Register</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <p><a href="login.html" data-i18n="already_have_account">Already have an account? Login</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
